<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* ==========================================================
   CONFIGURAÇÃO DO SUPABASE
   ========================================================== */

const SUPABASE_URL = "COLE_AQUI_A_URL_DO_SEU_PROJETO"; https://okrgeuuqbadsexsumjbz.supabase.co
const SUPABASE_PUBLIC_KEY = "COLE_AQUI_SUA_CHAVE_PUBLICA"; sb_publishable_2pow_sr87FSuqs7kZMYnBg_RbE5Sk7C

let supabaseClient = null;


/* ==========================================================
   INICIALIZAÇÃO DO SUPABASE
   ========================================================== */

function iniciarSupabase() {

    if (
        !SUPABASE_URL ||
        SUPABASE_URL.includes("COLE_AQUI") ||
        !SUPABASE_PUBLIC_KEY ||
        SUPABASE_PUBLIC_KEY.includes("COLE_AQUI")
    ) {
        console.warn("Supabase ainda não foi configurado.");
        return;
    }

    supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLIC_KEY
    );

    console.log("Supabase conectado.");
}


/* ==========================================================
   SOLICITAÇÕES
   ========================================================== */

function obterSolicitacoes() {

    try {

        return JSON.parse(
            localStorage.getItem("ls_solicitacoes_token") || "[]"
        );

    } catch (erro) {

        console.error(erro);

        return [];

    }
}


function salvarSolicitacoes(solicitacoes) {

    localStorage.setItem(
        "ls_solicitacoes_token",
        JSON.stringify(solicitacoes)
    );

}


/* ==========================================================
   HISTÓRICO
   ========================================================== */

function obterHistorico() {

    try {

        return JSON.parse(
            localStorage.getItem("ls_historico_tokens") || "[]"
        );

    } catch (erro) {

        return [];

    }

}


function salvarHistorico(historico) {

    localStorage.setItem(
        "ls_historico_tokens",
        JSON.stringify(historico)
    );

}


/* ==========================================================
   LIMPAR HISTÓRICO
   ========================================================== */

function limparHistorico() {

    var historico = obterHistorico();

    if (historico.length === 0) {

        alert("O histórico já está vazio.");

        return;

    }

    if (
        confirm(
            "Tem certeza que deseja apagar todo o histórico de códigos salvos?"
        )
    ) {

        localStorage.removeItem("ls_historico_tokens");

        renderizarHistorico();

    }

}


/* ==========================================================
   MOSTRAR SOLICITAÇÕES
   ========================================================== */

function renderizarSolicitacoes() {

    var tbody =
        document.getElementById("tabelaSolicitacoes");

    var count =
        document.getElementById("countPendentes");

    var solicitacoes =
        obterSolicitacoes();


    var pendentes =
        solicitacoes.filter(function (s) {

            return String(s.status).toLowerCase() === "pendente";

        });


    count.textContent =
        pendentes.length + " pedido(s)";


    if (pendentes.length === 0) {

        tbody.innerHTML =
            '<tr>' +
            '<td colspan="4" class="p-6 text-center text-slate-500">' +
            'Nenhuma solicitação de coordenador pendente no momento.' +
            '</td>' +
            '</tr>';

        return;

    }


    tbody.innerHTML =
        pendentes.map(function (item) {

            return (

                '<tr class="hover:bg-slate-700/30 transition">' +

                '<td class="p-3 font-semibold text-white">' +
                esc(item.escola || "-") +
                '</td>' +

                '<td class="p-3 text-blue-400 font-mono">' +
                esc(item.email || "-") +
                '</td>' +

                '<td class="p-3 text-slate-400">' +
                esc(item.data || "-") +
                '</td>' +

                '<td class="p-3 text-right">' +

                '<button ' +
                'onclick="selecionarParaEnvio(' +
                JSON.stringify(item.id) +
                ')" ' +
                'class="bg-blue-600/20 hover:bg-blue-600/40 text-blue-400 font-bold px-3 py-1.5 rounded-lg border border-blue-500/30 transition">' +

                '<i class="fa-solid fa-key mr-1"></i>' +
                ' Atender Pedido' +

                '</button>' +

                '</td>' +

                '</tr>'

            );

        }).join("");

}


/* ==========================================================
   SELECIONAR SOLICITAÇÃO
   ========================================================== */

function selecionarParaEnvio(id) {

    var solicitacoes =
        obterSolicitacoes();


    var item =
        solicitacoes.find(function (s) {

            return String(s.id) === String(id);

        });


    if (!item) {

        alert("Solicitação não encontrada.");

        return;

    }


    document.getElementById("envioId").value =
        item.id;


    document.getElementById("envioEmail").value =
        item.email || "";


    gerarNovoCodigo();


    var msgPadrao =
        "Olá, Coordenador(a)" +
        (item.escola ? " da " + item.escola : "") +
        ".\n\n" +

        "Sua solicitação de acesso ao sistema de Almoxarifado foi aprovada!" +
        "\n\n" +

        "Utilize o código de segurança abaixo no momento do seu cadastro:" +
        "\n\n" +

        "Atenciosamente,\nEquipe de Desenvolvimento.";


    document.getElementById("envioMensagem").value =
        msgPadrao;


    document.getElementById("btnEnviar").disabled =
        false;

}


/* ==========================================================
   GERAR CÓDIGO
   FORMATO: LS-XXXX-XXXX
   ========================================================== */

function gerarNovoCodigo() {

    var caracteres =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";


    function gerarParte(tamanho) {

        var resultado = "";

        for (var i = 0; i < tamanho; i++) {

            resultado +=
                caracteres.charAt(
                    Math.floor(
                        Math.random() *
                        caracteres.length
                    )
                );

        }

        return resultado;

    }


    var codigo =
        "LS-" +
        gerarParte(4) +
        "-" +
        gerarParte(4);


    document.getElementById("envioCodigo").value =
        codigo;

}


/* ==========================================================
   SALVAR TOKEN NO SUPABASE
   ========================================================== */

async function salvarTokenNoSupabase(
    codigo,
    email,
    escola
) {

    if (!supabaseClient) {

        throw new Error(
            "O Supabase não está configurado."
        );

    }


    var registro = {

        token: codigo,

        status: "disponivel",

        escola: escola || "",

        email: email || ""

    };


    var resultado =
        await supabaseClient
            .from("tokens")
            .insert([registro])
            .select()
            .single();


    if (resultado.error) {

        throw resultado.error;

    }


    return resultado.data;

}


/* ==========================================================
   ENVIAR / LIBERAR TOKEN
   ========================================================== */

async function enviarMensagem(event) {

    event.preventDefault();


    var id =
        document.getElementById("envioId").value;


    var email =
        document.getElementById("envioEmail").value;


    var codigo =
        document.getElementById("envioCodigo").value;


    if (!email || !codigo) {

        alert(
            "Selecione uma solicitação e gere um código."
        );

        return;

    }


    var botao =
        document.getElementById("btnEnviar");


    var textoOriginal =
        botao.innerHTML;


    botao.disabled = true;

    botao.innerHTML =
        '<i class="fa-solid fa-spinner fa-spin"></i> Salvando código...';


    try {

        var solicitacoes =
            obterSolicitacoes();


        var solicitacao =
            solicitacoes.find(function (item) {

                return (
                    String(item.id) === String(id)
                );

            });


        var escola =
            solicitacao
                ? (solicitacao.escola || "")
                : "";


        /* ==========================================
           SALVA NO SUPABASE
           ========================================== */

        await salvarTokenNoSupabase(
            codigo,
            email,
            escola
        );


        /* ==========================================
           ATUALIZA SOLICITAÇÃO
           ========================================== */

        solicitacoes.forEach(function (item) {

            if (
                String(item.id) === String(id)
            ) {

                item.status = "ENVIADO";

            }

        });


        salvarSolicitacoes(
            solicitacoes
        );


        /* ==========================================
           SALVA HISTÓRICO
           ========================================== */

        var historico =
            obterHistorico();


        historico.unshift({

            email: email,

            codigo: codigo,

            escola: escola,

            dataEnvio:
                new Date().toLocaleString("pt-BR"),

            statusCadastro:
                "Aguardando Uso"

        });


        salvarHistorico(
            historico
        );


        /* ==========================================
           MANTÉM COMPATIBILIDADE COM O PROTÓTIPO
           ========================================== */

        var tokens = [];


        try {

            tokens =
                JSON.parse(
                    localStorage.getItem(
                        "ls_tokens_coordenadores"
                    ) || "[]"
                );

        } catch (erro) {

            tokens = [];

        }


        tokens =
            tokens.filter(function (t) {

                return String(t.codigo) !==
                       String(codigo);

            });


        tokens.unshift({

            codigo: codigo,

            email: email,

            escola: escola,

            criadoEm:
                new Date().toLocaleString("pt-BR"),

            status: "disponivel"

        });


        localStorage.setItem(
            "ls_tokens_coordenadores",
            JSON.stringify(tokens)
        );


        /* ==========================================
           CONFIRMAÇÃO
           ========================================== */

        alert(

            "✅ Código liberado com sucesso!" +

            "\n\nCódigo: " +
            codigo +

            "\n\n" +

            "O código foi salvo no banco de dados."

        );


        /* ==========================================
           LIMPAR FORMULÁRIO
           ========================================== */

        document
            .getElementById("formEnvio")
            .reset();


        document
            .getElementById("envioId")
            .value = "";


        document
            .getElementById("btnEnviar")
            .disabled = true;


        renderizarSolicitacoes();

        renderizarHistorico();


    } catch (erro) {

        console.error(
            "Erro ao salvar token:",
            erro
        );


        alert(

            "❌ Não foi possível liberar o código." +

            "\n\n" +

            "Verifique:" +

            "\n• URL do Supabase" +

            "\n• Chave pública" +

            "\n• Tabela 'tokens'" +

            "\n• Permissões da tabela" +

            "\n\nDetalhe: " +

            (erro.message || erro)

        );


    } finally {

        botao.innerHTML =
            textoOriginal;

    }

}


/* ==========================================================
   HISTÓRICO
   ========================================================== */

function renderizarHistorico() {

    var tbody =
        document.getElementById(
            "tabelaHistorico"
        );


    var historico =
        obterHistorico();


    if (historico.length === 0) {

        tbody.innerHTML =
            '<tr>' +

            '<td colspan="4" class="p-6 text-center text-slate-500">' +

            'Nenhum código enviado ainda.' +

            '</td>' +

            '</tr>';

        return;

    }


    tbody.innerHTML =
        historico.map(function (h) {

            var tokensAtuais = [];


            try {

                tokensAtuais =
                    JSON.parse(
                        localStorage.getItem(
                            "ls_tokens_coordenadores"
                        ) || "[]"
                    );

            } catch (erro) {

                tokensAtuais = [];

            }


            var tokenAtual =
                tokensAtuais.find(
                    function (t) {

                        return String(t.codigo) ===
                               String(h.codigo);

                    }
                );


            var status =
                (
                    tokenAtual &&
                    tokenAtual.status === "usado"
                )

                ? "Usado"

                : h.statusCadastro;


            return (

                "<tr>" +

                '<td class="p-3 text-slate-300 font-mono">' +
                esc(h.email) +
                "</td>" +

                '<td class="p-3 font-mono font-bold text-emerald-400">' +
                esc(h.codigo) +
                "</td>" +

                '<td class="p-3 text-slate-400">' +
                esc(h.dataEnvio) +
                "</td>" +

                '<td class="p-3">' +

                '<span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2.5 py-0.5 rounded-full text-[10px] font-bold">' +

                esc(status) +

                "</span>" +

                "</td>" +

                "</tr>"

            );

        }).join("");

}


/* ==========================================================
   PROTEÇÃO CONTRA HTML
   ========================================================== */

function esc(s) {

    return String(s || "").replace(
        /[&<>"']/g,
        function (c) {

            return {

                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"

            }[c];

        }
    );

}


/* ==========================================================
   INICIAR
   ========================================================== */

iniciarSupabase();

renderizarSolicitacoes();

renderizarHistorico();

</script>
